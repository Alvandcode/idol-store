name: Deploy Admin Panel (Pages)

# پنل مدیریت وب Idol Store — استاتیک، بدون سرور.
# هر تغییر در پوشه admin-panel → دیپلوی خودکار روی GitHub Pages.
# آدرس: https://<owner>.github.io/<repo>/
# (Pages را یک‌بار در Settings → Pages → Source: GitHub Actions فعال کن.)

on:
  push:
    branches: [main]
    paths: ['admin-panel/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin-panel

      - id: deployment
        uses: actions/deploy-pages@v4
