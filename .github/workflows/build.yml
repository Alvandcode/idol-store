name: Build & Release Idol Store

# برای ساخت GitHub Release و اتصال APK به آن
permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # کلید امضای ثابت (لایسنس اپ) — از Secrets خوانده می‌شود تا همه نسخه‌ها
      # با یک امضا ساخته شوند و آپدیت‌ها بدون حذف، روی نسخه قبلی نصب شوند.
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/idol-store.keystore"

      # استخراج نسخه از تگ (v1.0.6 → name=1.0.6, code=10006)
      - name: Determine version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            IFS='.' read -r MAJ MIN PAT <<< "$V"
            PAT=$(echo "$PAT" | cut -d- -f1)
            CODE=$((MAJ*10000 + MIN*100 + PAT))
            echo "name=$V" >> "$GITHUB_OUTPUT"
            echo "code=$CODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APK
        env:
          IDOL_KEYSTORE: ${{ runner.temp }}/idol-store.keystore
          IDOL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          IDOL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          IDOL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon "-PAPP_VERSION_NAME=${{ steps.ver.outputs.name || '1.0.6' }}" "-PAPP_VERSION_CODE=${{ steps.ver.outputs.code || '10006' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: idol-store-apk
          path: app/build/outputs/apk/release/idolstore-*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/idolstore-*.apk
